<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מיני-סשנים</title>
    <style>
      :root {
        --bg: #111111;
        --panel: #191919;
        --panel-alt: #171717;
        --border: rgba(255,255,255,0.12);
        --text: #f4efe7;
        --muted: #c7bda8;
        --gold: #d8b36b;
        --gold-bright: #f3d189;
        --success: #9fc99d;
        --error: #f4b5b5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #0c0c0c 0%, #1a140e 100%);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .phone {
        width: min(100%, 390px);
        border-radius: 24px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        overflow: hidden;
      }
      .header {
        background: rgba(216,179,107,0.08);
        border-bottom: 1px solid var(--border);
        padding: 18px 18px 10px;
      }
      .title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .body { padding: 16px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill {
        background: rgba(216,179,107,0.12);
        border: 1px solid rgba(216,179,107,0.5);
        color: var(--gold-bright);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input, select, textarea, button {
        font: inherit;
      }
      .field {
        width: 100%;
        background: #121212;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .inline {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .primary {
        width: 100%;
        background: linear-gradient(135deg, var(--gold), var(--gold-bright));
        color: #1a1208;
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
      }
      .slot-list {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .slot {
        border-radius: 8px;
        border: 1px solid rgba(216,179,107,0.4);
        background: rgba(216,179,107,0.08);
        color: var(--gold-bright);
        font-size: 12px;
        padding: 5px 8px;
      }
      .small { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="header">
        <h1 class="title">מיני-סשנים</h1>
      </div>
      <div class="body">
        <div class="card">
          <div class="row" style="margin-bottom: 10px;">
            <span class="pill">יום ראשון</span>
            <span class="pill">שבת/חג חסומים</span>
          </div>
          <label class="label">תאריך</label>
          <input class="field" value="2026-10-11" type="date" />
          <div class="inline">
            <div>
              <label class="label">התחלה</label>
              <input class="field" value="09:00" type="time" />
            </div>
            <div>
              <label class="label">סיום</label>
              <input class="field" value="10:00" type="time" />
            </div>
          </div>
          <div class="inline">
            <div>
              <label class="label">משך</label>
              <input class="field" value="20" type="number" min="10" max="180" />
            </div>
            <div>
              <label class="label">מחיר</label>
              <input class="field" value="150" type="number" />
            </div>
          </div>
          <label class="label">הערות</label>
          <textarea class="field" rows="2">לפרחים + בובה</textarea>
          <button class="primary">שמור מיני-סשן</button>
        </div>

        <div class="card">
          <div class="small" style="margin-bottom: 8px;">משבצות זמינות</div>
          <div class="slot-list">
            <span class="slot">09:00</span>
            <span class="slot">09:20</span>
            <span class="slot">09:40</span>
            <span class="slot">10:00</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
